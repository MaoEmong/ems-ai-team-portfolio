spring:
  servlet:
    multipart:
      max-file-size: 5242880B
      max-request-size: 6291456B
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ems}?connectionTimeZone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
  flyway:
    enabled: true
server:
  port: 8080
ems:
  jwt-secret: ${JWT_SECRET}
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-login-id: ${ADMIN_LOGIN_ID}
    admin-password: ${ADMIN_INITIAL_PASSWORD}
    demo-admin-password: ${DEMO_ADMIN_INITIAL_PASSWORD:}
